{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h2>{{ page_title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Save Note</button>
        <a class="button secondary" href="{% url 'note_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
