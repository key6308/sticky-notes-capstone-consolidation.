{% extends "base.html" %}

{% block content %}
<h2>My Notes</h2>

{% if notes %}
<div class="notes-grid">
    {% for note in notes %}
    <article class="note-card">
        <h3>{{ note.title }}</h3>
        <p>{{ note.content|truncatechars:180 }}</p>
        <a href="{% url 'note_detail' note.pk %}">View note →</a>
    </article>
    {% endfor %}
</div>
{% else %}
<div class="empty-state">
    <h2>No notes yet.</h2>
    <p>Click “Add Note” to make your first sticky note.</p>
</div>
{% endif %}
{% endblock %}
